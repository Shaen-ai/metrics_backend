# Local Qdrant for catalog vector retrieval.
# Start: docker compose -f docker-compose.qdrant.yml up -d
# Set backend/.env: QDRANT_URL=http://127.0.0.1:6333

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
